apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/victorgrt/iot-part3-vgoret-app.git
    targetRevision: HEAD
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:        # automatically sync without manual intervention at regular interval (polling)
      prune: true     # ressources removed from git get deleted
      selfHeal: true  # manu changes in the cluster get reverted, git is the source of truth.
